name: Platform builds

on:
  workflow_call:
    inputs:
      version:
        description: Exact package version
        required: true
        type: string
    secrets:
      BETTERMAIL_MICROSOFT_CLIENT_ID:
        required: true
      BETTERMAIL_GOOGLE_CLIENT_ID:
        required: true
      BETTERMAIL_GOOGLE_CLIENT_SECRET:
        required: true

      BETTERMAIL_WINDOWS_CERTIFICATE:
        required: false
      BETTERMAIL_WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      BETTERMAIL_MACOS_CERTIFICATE:
        required: false
      BETTERMAIL_MACOS_CERTIFICATE_PASSWORD:
        required: false
      BETTERMAIL_MACOS_APP_IDENTITY:
        required: false
      BETTERMAIL_MACOS_INSTALLER_IDENTITY:
        required: false
      BETTERMAIL_APPLE_ID:
        required: false
      BETTERMAIL_APPLE_TEAM_ID:
        required: false
      BETTERMAIL_APPLE_APP_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows
    runs-on: blacksmith-2vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet tool restore
      - name: Test
        timeout-minutes: 5
        run: dotnet run --project tests/BetterMail.Tests --configuration Release -- -reporter verbose -longRunning 30
      - name: Package Windows
        shell: pwsh
        env:
          BETTERMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.BETTERMAIL_MICROSOFT_CLIENT_ID }}
          BETTERMAIL_GOOGLE_CLIENT_ID: ${{ secrets.BETTERMAIL_GOOGLE_CLIENT_ID }}
          BETTERMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTERMAIL_GOOGLE_CLIENT_SECRET }}
          BETTERMAIL_WINDOWS_CERTIFICATE: ${{ secrets.BETTERMAIL_WINDOWS_CERTIFICATE }}
          BETTERMAIL_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.BETTERMAIL_WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/package-release.ps1 -Runtime win-x64 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: BetterMail-windows-${{ inputs.version }}
          path: artifacts/release/win-x64/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build Linux
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore
        run: dotnet tool restore && dotnet restore BetterMail.slnx
      - name: Test
        run: dotnet test --solution BetterMail.slnx --configuration Release --no-restore
      - name: Package Linux
        shell: pwsh
        env:
          BETTERMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.BETTERMAIL_MICROSOFT_CLIENT_ID }}
          BETTERMAIL_GOOGLE_CLIENT_ID: ${{ secrets.BETTERMAIL_GOOGLE_CLIENT_ID }}
          BETTERMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTERMAIL_GOOGLE_CLIENT_SECRET }}
        run: ./scripts/package-release.ps1 -Runtime linux-x64 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: BetterMail-linux-${{ inputs.version }}
          path: artifacts/release/linux-x64/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet tool restore
      - name: Test
        timeout-minutes: 5
        run: dotnet run --project tests/BetterMail.Tests --configuration Release -- -reporter verbose -longRunning 30
      - name: Package macOS
        shell: pwsh
        env:
          BETTERMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.BETTERMAIL_MICROSOFT_CLIENT_ID }}
          BETTERMAIL_GOOGLE_CLIENT_ID: ${{ secrets.BETTERMAIL_GOOGLE_CLIENT_ID }}
          BETTERMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTERMAIL_GOOGLE_CLIENT_SECRET }}
          BETTERMAIL_MACOS_CERTIFICATE: ${{ secrets.BETTERMAIL_MACOS_CERTIFICATE }}
          BETTERMAIL_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.BETTERMAIL_MACOS_CERTIFICATE_PASSWORD }}
          BETTERMAIL_MACOS_APP_IDENTITY: ${{ secrets.BETTERMAIL_MACOS_APP_IDENTITY }}
          BETTERMAIL_MACOS_INSTALLER_IDENTITY: ${{ secrets.BETTERMAIL_MACOS_INSTALLER_IDENTITY }}
          BETTERMAIL_APPLE_ID: ${{ secrets.BETTERMAIL_APPLE_ID }}
          BETTERMAIL_APPLE_TEAM_ID: ${{ secrets.BETTERMAIL_APPLE_TEAM_ID }}
          BETTERMAIL_APPLE_APP_PASSWORD: ${{ secrets.BETTERMAIL_APPLE_APP_PASSWORD }}
        run: ./scripts/package-release.ps1 -Runtime osx-arm64 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: BetterMail-macos-${{ inputs.version }}
          path: artifacts/release/osx-arm64/*
          if-no-files-found: error
          retention-days: 14
