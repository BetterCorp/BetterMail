name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: blacksmith-2vcpu-ubuntu-2404
          - platform: Windows
            runner: windows-2025
          - platform: macOS
            runner: blacksmith-6vcpu-macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
          cache: true
          cache-dependency-path: Directory.Packages.props
      - run: dotnet restore BetterMail.slnx
      - run: dotnet build BetterMail.slnx --configuration Release --no-restore -m:1
      - name: Test signing certificate selection and cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-signing.ps1
      - name: Build offline UI preview
        if: runner.os == 'Linux'
        run: dotnet build tools/BetterMail.UiPreview --configuration Release -m:1
      - name: Run tests
        timeout-minutes: 3
        run: dotnet run --project tests/BetterMail.Tests --configuration Release --no-build -- -reporter verbose -longRunning 30
      - name: Publish smoke artifact
        run: dotnet publish src/BetterMail.App --configuration Release --no-restore --output artifacts/smoke -p:UseAppHost=false
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libxtst6 libice6 libsm6 libfontconfig1 libsecret-1-0 libwebkit2gtk-4.1-0
      - name: Check Linux compose keyboard input
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a dotnet run --project tools/BetterMail.UiPreview --configuration Release --no-build -- artifacts/compose-input --compose-input
      - name: Check recipient drag and drop
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a dotnet run --project tools/BetterMail.UiPreview --configuration Release --no-build -- artifacts/recipient-dragging --recipient-dragging
      - name: Smoke test published Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/smoke-startup.py artifacts/smoke/BetterMail.dll
      - name: Check email link navigation
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a dotnet run --project tools/BetterMail.UiPreview --configuration Release --no-build -- artifacts/email-links --email-links
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}
          path: artifacts/smoke/
          retention-days: 3
